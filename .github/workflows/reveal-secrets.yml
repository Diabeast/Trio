name: Reveal Secret Spaces
on: [push]

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
    - name: Show Secret with Spaces
      env:
        # Zorg dat de naam achter 'secrets.' precies klopt met jouw repository instelling!
        THE_SECRET: ${{ secrets.MATCH_SECRET }}
      run: |
        echo "Hieronder staat je secret met spaties ertussen:"
        echo "$THE_SECRET" | sed 's/./& /g'
